services:
  # Redis - Upload session state store with AOF persistence
  redis:
    image: redis:7-alpine
    container_name: rag-uploader-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    user: "999:999"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - rag-uploader-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MinIO - S3-compatible object storage for bronze-layer files
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: rag-uploader-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag-uploader-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MinIO initialization - Configure lifecycle policy for incomplete upload cleanup
  minio-init:
    image: minio/mc:RELEASE.2025-01-05T07-35-36Z
    container_name: rag-uploader-minio-init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin}
    volumes:
      - ./scripts/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    networks:
      - rag-uploader-network
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"  # Run once on startup

  # NATS JetStream - Event bus for FILE_LOAD_COMPLETED events
  nats:
    image: nats:2.10-alpine
    container_name: rag-uploader-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    user: "1000:1000"
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - rag-uploader-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ClamAV - Virus scanning service
  clamav:
    image: clamav/clamav:1.5
    container_name: rag-uploader-clamav
    ports:
      - "3310:3310"  # clamd TCP socket
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # ClamAV needs time to download virus definitions
    networks:
      - rag-uploader-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Stub Auth Service - JWT token generation for local development
  # DEVELOPMENT ONLY - DO NOT USE IN PRODUCTION
  auth-stub:
    build:
      context: ./auth_stub
      dockerfile: Dockerfile
    container_name: rag-uploader-auth-stub
    ports:
      - "8001:8001"  # HTTP API
    volumes:
      - auth_stub_keys:/app/keys  # Persist RSA keys across restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - rag-uploader-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rag-uploader-network:
    driver: bridge
    name: rag-uploader-network

volumes:
  redis_data:
    name: rag-uploader-redis-data
  minio_data:
    name: rag-uploader-minio-data
  nats_data:
    name: rag-uploader-nats-data
  clamav_data:
    name: rag-uploader-clamav-data
  auth_stub_keys:
    name: rag-uploader-auth-stub-keys
