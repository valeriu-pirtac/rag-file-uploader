[mypy]
# Strict type checking configuration for rag-file-uploader
# Enforces type safety throughout the codebase

# Enable strict mode - enables all strict type checking options
strict = True

# Python version target
python_version = 3.13

# Namespace packages support (PEP 420)
namespace_packages = True

# Exclude generated, cache, and build artifacts from type checking
exclude = (?x)(^\.venv/|^\.mypy_cache/|^\.ruff_cache/|^\.pytest_cache/|^htmlcov/|^dist/|^build/)

# Imports to ignore missing type stubs
ignore_missing_imports = False

# Optional: Define plugins for third-party libraries
# plugins = [
#     mypy_pydantic.plugin
# ]

[mypy-tests.*]
# Allow tests to be less strict with types if needed
# (typically kept strict for consistency)
ignore_errors = False

[mypy-src.infrastructure.*]
# Infrastructure adapters can be slightly less strict
# since they're dealing with external APIs
ignore_errors = False

[mypy-src.presentation.*]
# Presentation layer can use more flexible typing for FastAPI
# but still enforce core type safety
allow_untyped_defs = False
disallow_untyped_calls = True
